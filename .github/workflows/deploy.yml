name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site lives at /<repo>/, so Astro needs a matching base path.
      PAGES_BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # package-lock.json was generated against the npmmirror mirror;
      # CI pulls the same tarballs (identical integrity hashes) from npmjs.
      - name: Point lockfile at the official registry
        run: sed -i 's#https://registry\.npmmirror\.com/#https://registry.npmjs.org/#g' package-lock.json

      - run: npm ci
      - run: npm run build

      # Pages must be enabled once in repository settings with GitHub Actions
      # selected as the deployment source.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
